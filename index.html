<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Matrix PC Build Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="matrix-bg"></div>

    <div class="app-shell">
      <header class="app-header">
        <div class="logo-lockup">
          <div class="logo-mark">λ</div>
          <div class="logo-text">
            <div class="logo-title">Matrix PC Build Tracker</div>
            <div class="logo-subtitle">
              Components • Vendors • Warranties • Extended Coverage
            </div>
          </div>
        </div>
      </header>

      <main class="app-main">
        <!-- LEFT: FORM -->
        <section class="panel panel-left">
          <h2 class="panel-title">Part &amp; Warranty Editor</h2>
          <form id="part-form" class="matrix-form">
            <div class="form-grid">
              <div class="form-group">
                <label for="Category">Category</label>
                <input id="Category" name="Category" placeholder="CPU, GPU, etc." />
              </div>

              <div class="form-group">
                <label for="PartName">Part Name *</label>
                <input
                  id="PartName"
                  name="PartName"
                  placeholder="e.g. AMD Ryzen 9 9950X3D"
                  required
                />
              </div>

              <div class="form-group">
                <label for="Model">Model</label>
                <input
                  id="Model"
                  name="Model"
                  placeholder="Model / Capacity / Extra descriptor"
                />
              </div>

              <div class="form-group">
                <label for="VendorName">Vendor Name</label>
                <input id="VendorName" name="VendorName" placeholder="Amazon, Newegg..." />
              </div>

              <div class="form-group">
                <label for="VendorWebsite">Vendor Website</label>
                <input
                  id="VendorWebsite"
                  name="VendorWebsite"
                  placeholder="https://..."
                />
              </div>

              <div class="form-group">
                <label for="VendorLoginURL">Vendor Login URL</label>
                <input
                  id="VendorLoginURL"
                  name="VendorLoginURL"
                  placeholder="Login page URL"
                />
              </div>

              <div class="form-group">
                <label for="VendorUsername">Vendor Username</label>
                <input id="VendorUsername" name="VendorUsername" />
              </div>

              <div class="form-group">
                <label for="VendorPasswordHint">Vendor Password Hint</label>
                <input id="VendorPasswordHint" name="VendorPasswordHint" />
              </div>

              <div class="form-group">
                <label for="VendorSupportEmail">Vendor Support Email</label>
                <input id="VendorSupportEmail" name="VendorSupportEmail" />
              </div>

              <div class="form-group">
                <label for="VendorSupportPhone">Vendor Support Phone</label>
                <input id="VendorSupportPhone" name="VendorSupportPhone" />
              </div>

              <div class="form-group">
                <label for="PurchaseDate">Purchase Date</label>
                <input id="PurchaseDate" name="PurchaseDate" type="date" />
              </div>

              <div class="form-group">
                <label for="PricePaid">Price Paid</label>
                <input id="PricePaid" name="PricePaid" type="number" step="0.01" />
              </div>

              <div class="form-group">
                <label for="Currency">Currency</label>
                <input id="Currency" name="Currency" placeholder="USD, EUR..." />
              </div>

              <div class="form-group">
                <label for="OrderID">Order ID</label>
                <input id="OrderID" name="OrderID" />
              </div>

              <div class="form-group">
                <label for="SerialNumber">Serial Number</label>
                <input id="SerialNumber" name="SerialNumber" />
              </div>

              <div class="form-group">
                <label for="WarrantyProvider">Warranty Provider</label>
                <input id="WarrantyProvider" name="WarrantyProvider" />
              </div>

              <div class="form-group">
                <label for="WarrantyType">Warranty Type</label>
                <input id="WarrantyType" name="WarrantyType" />
              </div>

              <div class="form-group">
                <label for="WarrantyRegistrationURL">Warranty Registration URL</label>
                <input
                  id="WarrantyRegistrationURL"
                  name="WarrantyRegistrationURL"
                  placeholder="https://..."
                />
              </div>

              <div class="form-group">
                <label for="WarrantyLengthMonths">Warranty Length (months)</label>
                <input
                  id="WarrantyLengthMonths"
                  name="WarrantyLengthMonths"
                  type="number"
                />
              </div>

              <div class="form-group">
                <label for="WarrantyStartDate">Warranty Start Date</label>
                <input id="WarrantyStartDate" name="WarrantyStartDate" type="date" />
              </div>

              <div class="form-group">
                <label for="WarrantyEndDate">Warranty End Date</label>
                <input id="WarrantyEndDate" name="WarrantyEndDate" type="date" />
              </div>

              <div class="form-group">
                <label for="WarrantySupportEmail">Warranty Support Email</label>
                <input id="WarrantySupportEmail" name="WarrantySupportEmail" />
              </div>

              <div class="form-group">
                <label for="WarrantySupportPhone">Warranty Support Phone</label>
                <input id="WarrantySupportPhone" name="WarrantySupportPhone" />
              </div>

              <div class="form-group">
                <label for="ExtendedWarrantyProvider">Ext. Warranty Provider</label>
                <input
                  id="ExtendedWarrantyProvider"
                  name="ExtendedWarrantyProvider"
                />
              </div>

              <div class="form-group">
                <label for="ExtendedWarrantyLengthMonths">
                  Ext. Warranty Length (months)
                </label>
                <input
                  id="ExtendedWarrantyLengthMonths"
                  name="ExtendedWarrantyLengthMonths"
                  type="number"
                />
              </div>

              <div class="form-group">
                <label for="ExtendedWarrantyDetails">Ext. Warranty Details</label>
                <textarea
                  id="ExtendedWarrantyDetails"
                  name="ExtendedWarrantyDetails"
                  rows="2"
                ></textarea>
              </div>

              <div class="form-group">
                <label for="ExtendedWarrantySupportEmail">
                  Ext. Warranty Support Email
                </label>
                <input
                  id="ExtendedWarrantySupportEmail"
                  name="ExtendedWarrantySupportEmail"
                />
              </div>

              <div class="form-group">
                <label for="ExtendedWarrantySupportPhone">
                  Ext. Warranty Support Phone
                </label>
                <input
                  id="ExtendedWarrantySupportPhone"
                  name="ExtendedWarrantySupportPhone"
                />
              </div>

              <div class="form-group form-group-full">
                <label for="Notes">Notes</label>
                <textarea id="Notes" name="Notes" rows="2"></textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary">Save (Add / Update)</button>
              <button type="button" id="reset-form" class="btn-secondary">
                New / Clear
              </button>
              <button type="button" id="delete-part" class="btn-secondary btn-danger">
                Delete Selected
              </button>
            </div>
          </form>
        </section>

        <!-- RIGHT: TABLE -->
        <section class="panel panel-right">
          <div class="panel-header">
            <h2 class="panel-title">Parts Matrix</h2>
            <div class="panel-controls">
              <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Search parts, vendors, notes..."
              />
              <select id="category-filter" class="filter-select">
                <option value="">All Categories</option>
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
                <option value="Motherboard">Motherboard</option>
                <option value="Memory">Memory</option>
                <option value="Storage">Storage</option>
                <option value="Case">Case</option>
                <option value="Power Supply">Power Supply</option>
                <option value="Case Fan">Case Fan</option>
                <option value="Monitor">Monitor</option>
              </select>
              <div class="table-actions">
                <button type="button" id="download-csv" class="btn-ghost">
                  Download CSV (Table)
                </button>
                <button type="button" id="download-pdf" class="btn-ghost">
                  Download PDF (Table)
                </button>
              </div>
            </div>
          </div>

          <div class="table-wrapper">
            <table id="parts-table" class="matrix-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Part</th>
                  <th>Vendor</th>
                  <th>Price</th>
                  <th>Warranty</th>
                  <th>Ext. Warranty</th>
                  <th>Vendor Contact</th>
                  <th>Warranty Contact</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody>
                <!-- Filled by JS -->
              </tbody>
            </table>
          </div>

          <div id="totals-bar" class="totals-bar"></div>
        </section>
      </main>
    </div>

    <!-- Details / Notes Modal -->
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>

    <div id="details-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="details-close">×</button>
        <h3>Part Details</h3>
        <div id="details-title" class="modal-title"></div>

        <label for="details-notes">Details / Notes</label>
        <textarea id="details-notes" rows="6"></textarea>

        <div class="modal-actions">
          <button type="button" id="details-save" class="btn-primary">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- PDF libraries for exporting table as PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
