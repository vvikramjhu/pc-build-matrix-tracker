<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Matrix PC Build Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- MATRIX BACKGROUND -->
    <div class="matrix-bg"></div>

    <!-- APP SHELL -->
    <div class="app-shell">

      <!-- HEADER -->
      <header class="app-header">
        <div class="logo-lockup">
          <div class="logo-mark">λ</div>
          <div class="logo-text">
            <div class="logo-title">Matrix PC Build Tracker</div>
            <div class="logo-subtitle">
              Components • Vendors • Warranties • Extended Coverage
            </div>
          </div>
        </div>
      </header>

      <!-- MAIN LAYOUT -->
      <main class="app-main">

        <!-- LEFT PANEL: Form -->
        <section class="panel panel-left">

          <!-- Panel title + copy-all icon -->
          <div class="panel-title-row">
            <h2 class="panel-title">Part &amp; Warranty Editor</h2>
            <button
              type="button"
              id="copy-all-form"
              class="copy-all-btn"
              title="Copy entire form"
            >&#x2398; Copy All</button>
          </div>

          <form id="part-form" class="matrix-form">
            <div class="form-grid">

              <div class="form-group">
                <div class="field-label-row">
                  <label for="Category">Category</label>
                  <button type="button" class="copy-field-btn" data-field="Category" title="Copy">&#x2398;</button>
                </div>
                <input id="Category" name="Category" placeholder="CPU, GPU, etc." />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="PartName">Part Name *</label>
                  <button type="button" class="copy-field-btn" data-field="PartName" title="Copy">&#x2398;</button>
                </div>
                <input id="PartName" name="PartName" placeholder="e.g. AMD Ryzen 9 9950X3D" required />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="Model">Model</label>
                  <button type="button" class="copy-field-btn" data-field="Model" title="Copy">&#x2398;</button>
                </div>
                <input id="Model" name="Model" placeholder="Model / Capacity" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="VendorName">Vendor Name</label>
                  <button type="button" class="copy-field-btn" data-field="VendorName" title="Copy">&#x2398;</button>
                </div>
                <input id="VendorName" name="VendorName" placeholder="Amazon, Newegg..." />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="VendorWebsite">Vendor Website</label>
                  <button type="button" class="copy-field-btn" data-field="VendorWebsite" title="Copy">&#x2398;</button>
                </div>
                <input id="VendorWebsite" name="VendorWebsite" placeholder="https://..." />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="VendorUsername">Vendor Username</label>
                  <button type="button" class="copy-field-btn" data-field="VendorUsername" title="Copy">&#x2398;</button>
                </div>
                <input id="VendorUsername" name="VendorUsername" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="VendorPasswordHint">Vendor Password Hint</label>
                  <button type="button" class="copy-field-btn" data-field="VendorPasswordHint" title="Copy">&#x2398;</button>
                </div>
                <input id="VendorPasswordHint" name="VendorPasswordHint" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="PurchaseDate">Purchase Date</label>
                  <button type="button" class="copy-field-btn" data-field="PurchaseDate" title="Copy">&#x2398;</button>
                </div>
                <input id="PurchaseDate" name="PurchaseDate" type="date" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="PricePaid">Price Paid</label>
                  <button type="button" class="copy-field-btn" data-field="PricePaid" title="Copy">&#x2398;</button>
                </div>
                <input id="PricePaid" name="PricePaid" type="number" step="0.01" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="Currency">Currency</label>
                  <button type="button" class="copy-field-btn" data-field="Currency" title="Copy">&#x2398;</button>
                </div>
                <input id="Currency" name="Currency" placeholder="USD, EUR..." />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="OrderID">Order ID</label>
                  <button type="button" class="copy-field-btn" data-field="OrderID" title="Copy">&#x2398;</button>
                </div>
                <input id="OrderID" name="OrderID" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="SerialNumber">Serial Number</label>
                  <button type="button" class="copy-field-btn" data-field="SerialNumber" title="Copy">&#x2398;</button>
                </div>
                <input id="SerialNumber" name="SerialNumber" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyProvider">Warranty Provider</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyProvider" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyProvider" name="WarrantyProvider" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyType">Warranty Type</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyType" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyType" name="WarrantyType" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyRegistrationURL">Warranty Registration URL</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyRegistrationURL" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyRegistrationURL" name="WarrantyRegistrationURL" placeholder="https://..." />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyLengthMonths">Warranty Length (months)</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyLengthMonths" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyLengthMonths" name="WarrantyLengthMonths" type="number" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyStartDate">Warranty Start Date</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyStartDate" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyStartDate" name="WarrantyStartDate" type="date" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantyEndDate">Warranty End Date</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantyEndDate" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantyEndDate" name="WarrantyEndDate" type="date" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantySupportEmail">Warranty Support Email</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantySupportEmail" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantySupportEmail" name="WarrantySupportEmail" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="WarrantySupportPhone">Warranty Support Phone</label>
                  <button type="button" class="copy-field-btn" data-field="WarrantySupportPhone" title="Copy">&#x2398;</button>
                </div>
                <input id="WarrantySupportPhone" name="WarrantySupportPhone" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="ExtendedWarrantyProvider">Ext. Warranty Provider</label>
                  <button type="button" class="copy-field-btn" data-field="ExtendedWarrantyProvider" title="Copy">&#x2398;</button>
                </div>
                <input id="ExtendedWarrantyProvider" name="ExtendedWarrantyProvider" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="ExtendedWarrantyLengthMonths">Ext. Warranty Length (months)</label>
                  <button type="button" class="copy-field-btn" data-field="ExtendedWarrantyLengthMonths" title="Copy">&#x2398;</button>
                </div>
                <input id="ExtendedWarrantyLengthMonths" name="ExtendedWarrantyLengthMonths" type="number" />
              </div>

              <div class="form-group form-group-full">
                <div class="field-label-row">
                  <label for="ExtendedWarrantyDetails">Ext. Warranty Details</label>
                  <button type="button" class="copy-field-btn" data-field="ExtendedWarrantyDetails" title="Copy">&#x2398;</button>
                </div>
                <textarea id="ExtendedWarrantyDetails" name="ExtendedWarrantyDetails" rows="2"></textarea>
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="ExtendedWarrantySupportEmail">Ext. Warranty Support Email</label>
                  <button type="button" class="copy-field-btn" data-field="ExtendedWarrantySupportEmail" title="Copy">&#x2398;</button>
                </div>
                <input id="ExtendedWarrantySupportEmail" name="ExtendedWarrantySupportEmail" />
              </div>

              <div class="form-group">
                <div class="field-label-row">
                  <label for="ExtendedWarrantySupportPhone">Ext. Warranty Support Phone</label>
                  <button type="button" class="copy-field-btn" data-field="ExtendedWarrantySupportPhone" title="Copy">&#x2398;</button>
                </div>
                <input id="ExtendedWarrantySupportPhone" name="ExtendedWarrantySupportPhone" />
              </div>

              <div class="form-group form-group-full">
                <div class="field-label-row">
                  <label for="Notes">Notes</label>
                  <button type="button" class="copy-field-btn" data-field="Notes" title="Copy">&#x2398;</button>
                </div>
                <textarea id="Notes" name="Notes" rows="2"></textarea>
              </div>

            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions">
              <button type="submit" class="btn-primary">Save (Add / Update)</button>
              <button type="button" id="reset-form" class="btn-secondary">New / Clear</button>
              <button type="button" id="delete-part" class="btn-secondary btn-danger">Delete Selected</button>
            </div>
          </form>
        </section>

        <!-- RIGHT PANEL: Table -->
        <section class="panel panel-right">

          <div class="panel-header">
            <h2 class="panel-title">Parts Matrix</h2>
            <div class="panel-controls">
              <input type="text" id="search-input" class="search-input" placeholder="Search parts, vendors, notes..." />
              <select id="category-filter" class="filter-select">
                <option value="">All Categories</option>
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
                <option value="Motherboard">Motherboard</option>
                <option value="Memory">Memory</option>
                <option value="Storage">Storage</option>
                <option value="Case">Case</option>
                <option value="Power Supply">Power Supply</option>
                <option value="Case Fan">Case Fan</option>
                <option value="Monitor">Monitor</option>
              </select>
              <div class="table-actions">
                <button type="button" id="download-csv" class="btn-ghost">Download CSV</button>
                <button type="button" id="download-pdf" class="btn-ghost">Download PDF</button>
              </div>
            </div>
          </div>

          <div class="table-wrapper">
            <table id="parts-table" class="matrix-table">
              <thead>
                <tr>
                  <th class="resizable-th">Category</th>
                  <th class="resizable-th">Part</th>
                  <th class="resizable-th">Price</th>
                  <th class="resizable-th">Vendor</th>
                  <th class="resizable-th">Order #</th>
                  <th class="resizable-th">Warranty Owner</th>
                  <th class="resizable-th">Start Date</th>
                  <th class="resizable-th">End Date</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div id="totals-bar" class="totals-bar"></div>
        </section>
      </main>
    </div>

    <!-- NOTES MODAL -->
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>
    <div id="notes-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="notes-close">×</button>
        <h3>Part Notes</h3>
        <div id="notes-title" class="modal-title"></div>
        <label for="notes-textarea">Notes</label>
        <textarea id="notes-textarea" rows="6"></textarea>
        <div class="modal-actions">
          <button type="button" id="notes-save" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- COPY TOAST -->
    <div id="copy-toast" class="copy-toast hidden">Copied!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
